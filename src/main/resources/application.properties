# COPCOIN PROJESI ANA BAGLANTI AYARLARI 

# -- 1. PostgreSQL Baglanti Bilgileri --
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cryptopal}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:secretpassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# -- 2. Hibernate / JPA Yapilandirmasi --
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# -- 3. Redis Bulut/Local Ayarlari --
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:true}

# Swagger UI URL Ayari
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# Spring Boot Baslangic SQL Ayari
spring.sql.init.mode=always

# -- 4. Google Gemini AI Entegrasyon Ayarlari --
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent
gemini.api.key=${GEMINI_API_KEY:}